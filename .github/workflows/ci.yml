name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: setuhaul, POSTGRES_PASSWORD: setuhaul, POSTGRES_DB: setuhaul_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U setuhaul" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://setuhaul:setuhaul@localhost:5432/setuhaul_test
      JWT_SECRET: ci-secret
      PROVIDER_KEY_ENCRYPTION_KEY: "00000000000000000000000000000000"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      - run: pytest --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
